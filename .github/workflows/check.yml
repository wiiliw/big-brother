name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check documents and freshness
        shell: bash
        run: |
          set -o pipefail
          python scripts/check.py | tee maintenance-report.txt
      - name: Publish report
        if: always()
        run: |
          if [ -f maintenance-report.txt ]; then
            cat maintenance-report.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-report
          path: maintenance-report.txt
          if-no-files-found: ignore
